name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        run: choco install autohotkey -y
        shell: pwsh

      - name: Download Ahk2Exe
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          Write-Host "Downloading $($asset.name) from $($asset.browser_download_url)"
          Invoke-WebRequest $asset.browser_download_url -OutFile Ahk2Exe.zip
          Expand-Archive Ahk2Exe.zip -DestinationPath C:\Ahk2Exe
        shell: pwsh

      - name: Compile
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $ahk2exe = Get-ChildItem C:\Ahk2Exe -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
          $base    = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"
          Write-Host "Compiler: $ahk2exe"
          Write-Host "Base:     $base"
          & $ahk2exe /in IdleDesktopShow.ahk /out dist\IdleDesktopShow.exe /base $base
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IdleDesktopShow.exe
            IdleDesktopShow.ahk
          generate_release_notes: true
