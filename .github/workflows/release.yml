name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        run: choco install autohotkey -y
        shell: pwsh

      - name: Download Ahk2Exe
        run: |
          Invoke-WebRequest "https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip" -OutFile Ahk2Exe.zip
          Expand-Archive Ahk2Exe.zip -DestinationPath C:\Ahk2Exe
        shell: pwsh

      - name: Compile
        run: |
          New-Item -ItemType Directory -Force -Path dist
          & "C:\Ahk2Exe\Ahk2Exe.exe" /in IdleDesktopShow.ahk /out dist\IdleDesktopShow.exe
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IdleDesktopShow.exe
            IdleDesktopShow.ahk
          generate_release_notes: true
