name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        run: choco install autohotkey -y
        shell: pwsh

      - name: Download Ahk2Exe
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          Write-Host "Downloading $($asset.name) from $($asset.browser_download_url)"
          Invoke-WebRequest $asset.browser_download_url -OutFile Ahk2Exe.zip
          Expand-Archive Ahk2Exe.zip -DestinationPath C:\Ahk2Exe
        shell: pwsh

      - name: Diagnose paths
        run: |
          Write-Host "=== AutoHotkey install ==="
          Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse | Select-Object -ExpandProperty FullName
          Write-Host "=== Ahk2Exe zip contents ==="
          Get-ChildItem C:\Ahk2Exe -Recurse | Select-Object -ExpandProperty FullName
        shell: pwsh

      - name: Compile
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $ahk2exe = Get-ChildItem C:\Ahk2Exe -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
          $base    = Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk2exe) { throw "Ahk2Exe.exe not found" }
          if (-not $base)    { throw "AutoHotkey64.exe not found" }
          $script = Join-Path $PWD "IdleDesktopShow.ahk"
          $out    = Join-Path $PWD "dist\IdleDesktopShow.exe"
          Write-Host "Compiler: $ahk2exe"
          Write-Host "Base:     $base"
          Write-Host "Script:   $script"
          $proc = Start-Process -FilePath $ahk2exe `
            -ArgumentList "/in `"$script`" /out `"$out`" /base `"$base`"" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput compile_out.txt -RedirectStandardError compile_err.txt
          if (Test-Path compile_out.txt) { Write-Host "STDOUT:"; Get-Content compile_out.txt }
          if (Test-Path compile_err.txt) { Write-Host "STDERR:"; Get-Content compile_err.txt }
          Write-Host "Exit code: $($proc.ExitCode)"
          if (-not (Test-Path $out)) { throw "Compile produced no output" }
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IdleDesktopShow.exe
            IdleDesktopShow.ahk
          generate_release_notes: true
